# ============================================================
# Taller CRUD de imagenes BLOB - configuracion del backend
# ============================================================
spring.application.name=taller_jwt
server.port=${SERVER_PORT:8080}

# Base de datos PostgreSQL.
# La clave se toma de DB_PASSWORD o, si no existe, de PGPASSWORD.
# Nunca escribas la clave real en este archivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mascotas_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza la tabla automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Tamano maximo de cada foto (5 MB) y de la peticion multipart.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT: cambia el secreto en produccion con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-bytes-para-produccion-2026}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}

# Mensajes de error limpios en consola.
server.error.include-message=never
